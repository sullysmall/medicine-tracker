<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medicine Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
        <path d="m8.5 8.5 7 7"/>
      </svg>
      Medicine Tracker
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="tab-log">📋 Dose Log</button>
      <button class="tab-btn" data-tab="tab-medicines">💊 Medicines</button>
    </nav>
  </div>
</header>

<main>

  <!-- ===== Dose Log Tab ===== -->
  <div id="tab-log" class="tab-panel active">

    <!-- Stats row -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-today">0</div>
        <div class="stat-label">Doses today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total doses</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-medicines">0</div>
        <div class="stat-label">Medicines</div>
      </div>
    </div>

    <!-- Log a dose form -->
    <div class="card">
      <h2 class="section-title" id="log-form-title">Log a Dose</h2>
      <form id="log-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="log-medicine">Medicine</label>
            <select id="log-medicine" required>
              <option value="">— Select a medicine —</option>
            </select>
          </div>
          <div class="form-group">
            <label for="log-datetime">Date &amp; Time</label>
            <input type="datetime-local" id="log-datetime" required />
          </div>
          <div class="form-group full-width">
            <label for="log-notes">Notes <span style="font-weight:400;text-transform:none">(optional)</span></label>
            <textarea id="log-notes" placeholder="e.g. taken with food, symptoms noted…"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="log-cancel" style="display:none">Cancel</button>
          <button type="submit" class="btn btn-primary" id="log-submit">Log Dose</button>
        </div>
      </form>
    </div>

    <!-- Filters -->
    <div class="log-filters" style="margin-top:1.5rem">
      <select id="filter-medicine">
        <option value="">All medicines</option>
      </select>
      <input type="date" id="filter-date" title="Filter by date" />
      <button class="btn btn-ghost btn-sm" id="clear-filters">Clear filters</button>
    </div>

    <!-- Log list -->
    <div id="log-list" class="log-list"></div>

  </div><!-- /tab-log -->


  <!-- ===== Medicines Tab ===== -->
  <div id="tab-medicines" class="tab-panel">

    <!-- Add / Edit medicine form -->
    <div class="card">
      <h2 class="section-title" id="med-form-title">Add Medicine</h2>
      <form id="medicine-form">
        <div class="form-grid three-col">
          <div class="form-group full-width">
            <label for="med-name">Name</label>
            <input type="text" id="med-name" placeholder="e.g. Ibuprofen" required />
          </div>
          <div class="form-group">
            <label for="med-dosage">Dosage</label>
            <input type="text" id="med-dosage" placeholder="e.g. 400mg" />
          </div>
          <div class="form-group">
            <label for="med-timing">Timing / Frequency</label>
            <input type="text" id="med-timing" placeholder="e.g. Every 8 hours with food" />
          </div>
          <div class="form-group">
            <label for="med-color">Colour</label>
            <div class="color-row">
              <input type="color" id="med-color" value="#3182ce" />
              <div class="color-swatches" id="color-swatches"></div>
            </div>
          </div>
          <div class="form-group full-width">
            <label for="med-info">Additional info <span style="font-weight:400;text-transform:none">(optional)</span></label>
            <input type="text" id="med-info" placeholder="e.g. Complete full course, take with food…" />
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="med-cancel" style="display:none">Cancel</button>
          <button type="submit" class="btn btn-primary" id="med-submit">Add Medicine</button>
        </div>
      </form>
    </div>

    <!-- Medicine list -->
    <p class="section-title" style="margin-top:1.5rem">Your Medicines</p>
    <div id="medicine-list" class="medicine-list"></div>

  </div><!-- /tab-medicines -->

</main>

<!-- Toast notification -->
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
